# Publica o dashboard (Next.js, exportação estática) no GitHub Pages.
# Só Node: o painel.json já está versionado em dashboard/public/dados/, então o Python não roda aqui.
name: Publicar dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/publicar-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a que está em andamento termina antes da próxima começar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Preparar o Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      # O basePath (/analise-no-show-consultas) já está no next.config e entra quando
      # NODE_ENV=production. Por isso o configure-pages NÃO usa static_site_generator: next,
      # que reescreveria o next.config.
      - name: Gerar o site estático
        run: npm run build

      - name: Configurar o Pages
        uses: actions/configure-pages@v6

      - name: Enviar a pasta out
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
